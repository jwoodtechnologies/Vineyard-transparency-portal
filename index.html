<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vineyard Transparency Portal</title>
    <meta
      name="description"
      content="Search Vineyard, Utah public records. Ask a question, search the archive, and see the records behind every answer. An independent public-records project."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="Vineyard Transparency Portal" />
    <meta property="og:title" content="Vineyard Transparency Portal" />
    <meta property="og:description" content="Search Vineyard, Utah public records. Ask a question, search the archive, and see the records behind every answer." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vineyardportal.org/" />
    <meta property="og:image" content="https://vineyardportal.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vineyard Transparency Portal. Public records of Vineyard, Utah." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vineyard Transparency Portal" />
    <meta name="twitter:description" content="Search Vineyard, Utah public records. Ask a question, search the archive, and see the records behind every answer." />
    <meta name="twitter:image" content="https://vineyardportal.org/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Vineyard Transparency Portal: newest records" href="/feeds/records.xml" />
    <link rel="alternate" type="application/rss+xml" title="Vineyard Transparency Portal: upcoming meetings" href="/feeds/meetings.xml" />
    <!--
      App shell: the header and the page title paint from this inline CSS before any script or stylesheet
      arrives. The values copy src/console/console.css (.vc tokens, .vc-topbar, .vc-wordmark, .vc-page,
      .vc-page-title, .vc-hero); src/main.tsx removes the shell when the app draws its first screen.
    -->
    <style>
      /* Metric-matched fallbacks (the same faces as console.css): text does not move when the web fonts arrive. */
      @font-face { font-family: 'Inter Fallback'; src: local('Arial'), local('Liberation Sans'), local('Helvetica'); size-adjust: 106.11%; ascent-override: 91.41%; descent-override: 22.62%; line-gap-override: 0%; }
      @font-face { font-family: 'Source Serif Fallback'; src: local('Times New Roman'), local('Liberation Serif'), local('Times'); size-adjust: 119.5%; ascent-override: 87.02%; descent-override: 28.45%; line-gap-override: 0%; }
      html, body { margin: 0; background: #fff; }
      html.dark, html.dark body { background: #0a0a0b; }
      #vtp-shell {
        --s-bg: #fff; --s-ink: #0b0b0d; --s-muted: #5f6067; --s-line: rgba(11, 11, 13, 0.08); --s-accent: #7a2d52;
        position: relative; z-index: 1; min-height: 100dvh; background: var(--s-bg); color: var(--s-ink);
        font-family: 'Inter Variable', 'Inter Fallback', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased; overflow-x: clip;
      }
      html.dark #vtp-shell { --s-bg: #0a0a0b; --s-ink: #f5f5f6; --s-muted: #a3a3ab; --s-line: rgba(255, 255, 255, 0.08); --s-accent: #e6a9c6; }
      #vtp-shell *, #vtp-shell *::before, #vtp-shell *::after { box-sizing: border-box; }
      #vtp-shell .s-top { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.85rem clamp(1rem, 3vw, 1.75rem); background: var(--s-bg); }
      #vtp-shell .s-home { display: block; padding: 0.2rem; color: var(--s-ink); text-decoration: none; }
      #vtp-shell .s-word { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
      #vtp-shell .s-name { font-family: 'Source Serif 4 Variable', 'Source Serif Fallback', Georgia, 'Times New Roman', serif; font-weight: 560; font-size: 1.12rem; letter-spacing: -0.015em; }
      #vtp-shell .s-tag { margin-top: 0.3rem; font-size: 0.56rem; font-weight: 600; letter-spacing: 0.34em; text-transform: uppercase; color: var(--s-muted); }
      #vtp-shell .s-btn { display: inline-flex; width: 2.25rem; height: 2.25rem; align-items: center; justify-content: center; color: var(--s-ink); }
      #vtp-shell .s-page { width: min(780px, 100%); margin: 0 auto; padding: 1.5rem 1rem 4rem; }
      html[data-route='budget'] #vtp-shell .s-page, html[data-route='meetings'] #vtp-shell .s-page { width: min(1040px, 100%); }
      html[data-route='votes'] #vtp-shell .s-page, html[data-route='planning'] #vtp-shell .s-page { width: min(1200px, 100%); }
      #vtp-shell .s-head { margin: 1rem 0 1.5rem; }
      #vtp-shell .s-title { margin: 0; min-height: 1.08em; font-family: 'Source Serif 4 Variable', 'Source Serif Fallback', Georgia, 'Times New Roman', serif; font-weight: 520; font-size: clamp(2rem, 4.4vw, 2.875rem); line-height: 1.1; text-wrap: balance; letter-spacing: -0.03em; }
      #vtp-shell .s-lines i { display: block; height: 0.9rem; margin: 0 0 0.85rem; border-radius: 6px; background: var(--s-line); }
      #vtp-shell .s-lines i:nth-child(1) { width: 92%; } #vtp-shell .s-lines i:nth-child(2) { width: 76%; } #vtp-shell .s-lines i:nth-child(3) { width: 84%; }
      #vtp-shell .s-landing { display: none; min-height: 100dvh; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem 6.5rem; text-align: center; }
      #vtp-shell .s-hero { margin: 0; font-family: 'Source Serif 4 Variable', 'Source Serif Fallback', Georgia, 'Times New Roman', serif; font-weight: 520; font-size: clamp(2.35rem, 5.6vw, 3.9rem); line-height: 1.02; letter-spacing: -0.035em; }
      #vtp-shell .s-hero em { font-style: italic; font-weight: 400; color: var(--s-accent); }
      #vtp-shell .s-rule { margin: 1.05rem 0 0; font-size: 0.64rem; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; color: var(--s-muted); }
      html[data-route='console'] #vtp-shell .s-top { position: fixed; left: 0; right: 0; background: none; justify-content: flex-end; }
      html[data-route='console'] #vtp-shell .s-home, html[data-route='console'] #vtp-shell .s-page { display: none; }
      html[data-route='console'] #vtp-shell .s-landing { display: flex; }
      html[data-route='map'] #vtp-shell .s-page, html[data-route='document'] #vtp-shell .s-head, html[data-route='meeting'] #vtp-shell .s-head, html[data-route='service'] #vtp-shell .s-head, html[data-route='other'] #vtp-shell .s-head { display: none; }
      html[data-route='votes'] #vtp-shell .s-title::after { content: 'City Council Voting Recap'; }
      html[data-route='planning'] #vtp-shell .s-title::after { content: 'Planning Commission Voting Recap'; }
      html[data-route='budget'] #vtp-shell .s-title::after { content: 'Budget'; }
      html[data-route='add'] #vtp-shell .s-title::after { content: 'Submit a public record'; }
      html[data-route='sources'] #vtp-shell .s-title::after { content: 'Sources'; }
      html[data-route='meetings'] #vtp-shell .s-title::after { content: 'Calendar'; }
      html[data-route='people'] #vtp-shell .s-title::after { content: 'People'; }
      html[data-route='boards'] #vtp-shell .s-title::after { content: 'Boards and commissions'; }
      html[data-route='services'] #vtp-shell .s-title::after { content: 'City services'; }
      @media (max-width: 420px) {
        #vtp-shell .s-top { padding: 0.7rem 0.75rem; }
        #vtp-shell .s-name { font-size: 1.02rem; }
        #vtp-shell .s-tag { white-space: nowrap; letter-spacing: 0.2em; font-size: 0.5rem; }
      }
      /* The first screen replaces the shell in place: no fade or rise on top of it. */
      html.vtp-boot .vc-topbar, html.vtp-boot .vc-page, html.vtp-boot .vc-hero, html.vtp-boot .vc-corners, html.vtp-boot .vc-landing .vc-composer-wrap { animation: none; }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui">
        The Vineyard Transparency Portal needs JavaScript to search the archive.
      </p>
    </noscript>
    <div id="vtp-shell" aria-hidden="true">
      <header class="s-top">
        <a href="/" class="s-home" tabindex="-1"><span class="s-word"><span class="s-name">Vineyard</span><span class="s-tag">Transparency Portal</span></span></a>
        <span class="s-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 6h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /><path d="M7 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /><circle cx="3.6" cy="12" r="1.25" fill="currentColor" /></svg>
        </span>
      </header>
      <main class="s-page">
        <div class="s-head"><h1 class="s-title"></h1></div>
        <div class="s-lines"><i></i><i></i><i></i></div>
      </main>
      <main class="s-landing">
        <h1 class="s-hero">Vineyard <em>Transparency</em> Portal</h1>
        <p class="s-rule">Public records of Vineyard, Utah</p>
      </main>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
