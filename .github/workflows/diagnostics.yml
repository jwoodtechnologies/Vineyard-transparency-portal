# Read-only diagnostics for maintainers who cannot reach the city sites directly.
# Saves copies of source pages and API responses, or the log of a short crawl, to the
# `diagnostics` branch (diag/<run id>/). Never touches main. Start it from the Actions tab.
# owner-filter: counts of parcel owners the map card would show or withhold (no withheld names
# anywhere), with 30 random shown names, in diag/<run id>/owner-filter.json.
name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to capture
        type: choice
        default: fixtures
        options: [fixtures, crawl-log, ingest-log, archive-plan, perf, map-perf, map-speed, map-shots, sv-shots, drive-shots, sw-check, scenery-shots, google-shots, owner-filter, ask-timing]
      urls:
        description: Extra URLs to save (space separated, optional)
        default: ""
      questions:
        description: For ask-timing, questions separated by | (billed to the tests Neuron bucket)
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VTP_API_BASE: ${{ vars.VTP_API_BASE || 'https://vineyardportal.org,https://vineyard-transparency-portal.citizenjwood.workers.dev' }}
      VTP_OIDC_AUDIENCE: vineyardportal.org
      VTP_TRIGGER: diagnostics
      TASK: ${{ inputs.task }}
      QUESTIONS: ${{ inputs.questions }}
      EXTRA: ${{ inputs.urls }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.task != 'fixtures' && inputs.task != 'perf' && inputs.task != 'map-perf' && inputs.task != 'map-speed' && inputs.task != 'map-shots' && inputs.task != 'sv-shots' && inputs.task != 'scenery-shots' && inputs.task != 'sw-check' && inputs.task != 'drive-shots' && inputs.task != 'google-shots' && inputs.task != 'owner-filter' && inputs.task != 'ask-timing'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt
      # Node 24 runs the Worker's TypeScript owner filter as is (type stripping), for owner-filter.
      - uses: actions/setup-node@v4
        if: inputs.task == 'owner-filter' || inputs.task == 'ask-timing' || inputs.task == 'map-shots' || inputs.task == 'map-speed' || inputs.task == 'sv-shots' || inputs.task == 'scenery-shots' || inputs.task == 'sw-check' || inputs.task == 'drive-shots' || inputs.task == 'google-shots'
        with:
          node-version: 24
      - name: Capture
        run: |
          set -uo pipefail
          OUT="diag/${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          UA="VineyardTransparencyPortal/1.0 (+https://vineyardportal.org; public records archive)"
          save() { # save <name> <url>
            curl -sSL --max-time 60 -A "$UA" -o "$OUT/$1" -w "$1 %{http_code} %{size_download} %{url_effective}\n" "$2" >> "$OUT/index.txt" 2>>"$OUT/errors.txt" || echo "$1 FAILED $2" >> "$OUT/index.txt"
          }
          if [[ "$TASK" == "fixtures" ]]; then
            G=https://www.vineyardutah.gov
            CC=https://vineyardut.api.civicclerk.com/v1
            P=https://vineyardportal.org/api
            save construction.html "$G/government/construction_projects.php"
            save transparency.html "$G/transparency_portal/index.php"
            save rda.html "$G/government/redevelopment_agency/index.php"
            save agendas_notices.html "$G/government/agenda_minutes___public_notice.php"
            save calendar.html "$G/calendar.php"
            save revize_calendar.json "$G/_assets_/plugins/revizeCalendar/calendar_data_handler.php?webspace=vineyard&relative_revize_url=//cms3.revize.com&protocol=https:"
            save cc_event_1706.json "$CC/Events/1706"
            save cc_event_1711.json "$CC/Events/1711"
            save cc_events_upcoming.json "$CC/Events?\$filter=startDateTime%20ge%202026-09-20T00:00:00Z&\$orderby=startDateTime"
            save pmn_index.html "https://www.utah.gov/pmn/index.html"
            save pmn_sitemap.xml "https://www.utah.gov/pmn/sitemap.xml"
            save pmn_search_vineyard.html "https://www.utah.gov/pmn/search.html?q=vineyard"
            save portal_stats.json "$P/stats"
            save portal_sources.json "$P/sources"
            save portal_latest.json "$P/latest"
            save portal_health.json "$P/health"
            save portal_meetings_upcoming.json "$P/meetings?upcoming=1&pageSize=50"
            save portal_meetings_2026.json "$P/meetings?year=2026&pageSize=100"
            save portal_events.json "$P/events"
            # Is the city site refusing this network, or this user agent?
            BUA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36"
            curl -sSL --max-time 60 -A "$BUA" -o "$OUT/construction_browser_ua.html" -w "construction_browser_ua.html %{http_code} %{size_download}\n" "$G/government/construction_projects.php" >> "$OUT/index.txt" 2>>"$OUT/errors.txt" || true
            curl -sSI --max-time 30 -A "$BUA" "$G/" > "$OUT/city_headers_browser_ua.txt" 2>&1 || true
            curl -sSI --max-time 30 -A "$UA" "$G/" > "$OUT/city_headers_portal_ua.txt" 2>&1 || true
            curl -sS --max-time 20 https://api.ipify.org > "$OUT/runner_ip.txt" 2>&1 || true
            # Portal caching headers: pages revalidate, hashed assets are immutable, API keyed to build and data.
            for u in "https://vineyardportal.org/" "https://vineyardportal.org/votes" "https://vineyardportal.org/theme-init.js" "https://vineyardportal.org/api/records/ordinances?year=2026"; do
              echo "== $u" >> "$OUT/portal_headers.txt"; curl -sSI --max-time 30 "$u" >> "$OUT/portal_headers.txt" 2>&1 || true
            done
            A=$(curl -sS --max-time 30 https://vineyardportal.org/ | grep -oE '/assets/[^"]+\.js' | head -1 || true)
            if [[ -n "$A" ]]; then echo "== $A" >> "$OUT/portal_headers.txt"; curl -sSI --max-time 30 "https://vineyardportal.org$A" >> "$OUT/portal_headers.txt" 2>&1 || true; fi
            # Utah Public Notice Website: entity search for Vineyard (POST form with a CSRF token).
            J="$RUNNER_TEMP/pmn.cookies"
            curl -sS -c "$J" -b "$J" -A "$UA" "https://www.utah.gov/pmn/search.html" -o "$OUT/pmn_form.html" || true
            CSRF=$(grep -o 'name="_csrf" value="[^"]*"' "$OUT/pmn_form.html" | head -1 | sed 's/.*value="//;s/"//')
            curl -sS -c "$J" -b "$J" -A "$UA" -X POST "https://www.utah.gov/pmn/search.html" \
              --data-urlencode "entityName=Vineyard" --data-urlencode "_csrf=$CSRF" --data-urlencode "startDate=2026-08-01" \
              -o "$OUT/pmn_results_vineyard.html" -w "pmn_results_vineyard.html %{http_code} %{size_download}\n" >> "$OUT/index.txt" || true
            FIRST=$(grep -oE 'href="[^"]*(notice|sitemap)[^"]*"' "$OUT/pmn_results_vineyard.html" | head -3 | sed 's/href="//;s/"$//')
            n=0; for u in $FIRST; do n=$((n+1)); case "$u" in http*) ;; /*) u="https://www.utah.gov$u";; *) u="https://www.utah.gov/pmn/$u";; esac; save "pmn_notice_$n.html" "$u"; done
            save pmn_rss.html "https://www.utah.gov/pmn/rss.html"
            i=0; for u in $EXTRA; do i=$((i+1)); save "extra_$i" "$u"; done
          elif [[ "$TASK" == "perf" ]]; then
            # Page load timings for the main pages, phone (Fast 4G, CPU 4x) and desktop, cold and repeat (scripts/perf/perf.mjs).
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            PERF=(node scripts/perf/perf.mjs --base https://vineyardportal.org --runs 3 --pw "$PW/node_modules/playwright/index.mjs")
            "${PERF[@]}" --out "$OUT/perf.json" > "$OUT/perf.txt" 2>&1 || echo "exit=$?" >> "$OUT/perf.txt"
            "${PERF[@]}" --desktop --out "$OUT/perf-desktop.json" > "$OUT/perf-desktop.txt" 2>&1 || echo "exit=$?" >> "$OUT/perf-desktop.txt"
          elif [[ "$TASK" == "owner-filter" ]]; then
            # Every Vineyard parcel through worker/lib/ownerFilter.ts. Writes counts by reason and 30 random
            # SHOWN names only; withheld names are never printed or written (scripts/owner-filter/run.mjs).
            node scripts/owner-filter/run.mjs --out "$OUT/owner-filter.json" --explain "${EXTRA}" --acres-over 90 --explain-exempt > "$OUT/owner-filter.txt" 2>&1 || echo "exit=$?" >> "$OUT/owner-filter.txt"
          elif [[ "$TASK" == "ask-timing" ]]; then
            # Questions through POST /api/ask (stream), the tests Neuron bucket: first words, total, engine, answer.
            IFS='|' read -r -a QS <<< "${QUESTIONS}"
            node scripts/ask-timing/run.mjs --base https://vineyardportal.org --out "$OUT/ask-timing.json" "${QS[@]}" > "$OUT/ask-timing.txt" 2>&1 || echo "exit=$?" >> "$OUT/ask-timing.txt"
          elif [[ "$TASK" == "sv-shots" ]]; then
            # Screenshots of the live map's street view (scripts/shots/sv-shots.mjs), phone and desktop, as PNGs.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            node scripts/shots/sv-shots.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/shots" > "$OUT/sv-shots.txt" 2>&1 || echo "exit=$?" >> "$OUT/sv-shots.txt"
          elif [[ "$TASK" == "drive-shots" ]]; then
            # Drive mode on the live site (scripts/shots/drive-shots.mjs): screenshots, a short recording, speeds.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            node scripts/shots/drive-shots.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/shots" > "$OUT/drive-shots.txt" 2>&1 || echo "exit=$?" >> "$OUT/drive-shots.txt"
          elif [[ "$TASK" == "sw-check" ]]; then
            # The satellite map with the service worker, fresh and after the old worker (scripts/shots/sw-check.mjs).
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            node scripts/shots/sw-check.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/shots" > "$OUT/sw-check.txt" 2>&1 || echo "exit=$?" >> "$OUT/sw-check.txt"
          elif [[ "$TASK" == "google-shots" ]]; then
            # The map's Google Street View mode (scripts/shots/google-shots.mjs): opens, CSP refusals, sync, close.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            node scripts/shots/google-shots.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/shots" > "$OUT/google-shots.txt" 2>&1 || echo "exit=$?" >> "$OUT/google-shots.txt"
          elif [[ "$TASK" == "scenery-shots" ]]; then
            # The 3D view's scenery (scripts/shots/scenery-shots.mjs): snow, lake, sun, far mountains, frames per second.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            node scripts/shots/scenery-shots.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/shots" > "$OUT/scenery-shots.txt" 2>&1 || echo "exit=$?" >> "$OUT/scenery-shots.txt"
          elif [[ "$TASK" == "map-shots" ]]; then
            # Screenshots of the live map's tools (scripts/shots/map-shots.mjs), phone and desktop, as PNGs.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            P=$(python3 -c "print(';'.join(f'{-111.7475+i*0.0001:.5f},40.30440' for i in range(30)))")
            for q in "-111.74500,40.30500;-111.74400,40.30500" "$P"; do curl -sS -o /dev/null --max-time 60 -w "elevation $(echo "$q" | tr ';' '\n' | wc -l) points: %{http_code} %{time_total}s\n" "https://vineyardportal.org/api/map/elevation?p=$q" >> "$OUT/map-shots-timing.txt" 2>&1 || true; done
            node scripts/shots/map-shots.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/shots" > "$OUT/map-shots.txt" 2>&1 || echo "exit=$?" >> "$OUT/map-shots.txt"
          elif [[ "$TASK" == "map-speed" ]]; then
            # Map speed (scripts/perf/map-speed.mjs): first paint, settle after a 2 km pan and back, tile refetches.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            node scripts/perf/map-speed.mjs --base https://vineyardportal.org --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/map-speed.json" > "$OUT/map-speed.txt" 2>&1 || echo "exit=$?" >> "$OUT/map-speed.txt"
          elif [[ "$TASK" == "map-perf" ]]; then
            # Parcel lines on /map at zoom 12 to 15 on the phone profile: bytes over the wire and time until drawn.
            PW="$RUNNER_TEMP/pw"; mkdir -p "$PW"
            (cd "$PW" && npm init -y > /dev/null && npm i -s playwright@1.56.1 && npx playwright install --with-deps chromium) > "$OUT/setup.txt" 2>&1 || true
            for l in low mid; do curl -sS -o /dev/null --compressed -w "parcel-lines-$l %{http_code} %{size_download} bytes over the wire\n" "https://vineyardportal.org/api/map/parcel-lines?level=$l" >> "$OUT/map-perf.txt" 2>&1 || true; done
            curl -sSI -H "accept-encoding: gzip" "https://vineyardportal.org/api/map/parcel-lines?level=low" > "$OUT/parcel-lines-headers.txt" 2>&1 || true
            node scripts/perf/perf.mjs --base https://vineyardportal.org --map --runs 3 --pw "$PW/node_modules/playwright/index.mjs" --out "$OUT/map-perf.json" >> "$OUT/map-perf.txt" 2>&1 || echo "exit=$?" >> "$OUT/map-perf.txt"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr antiword > "$OUT/setup.txt" 2>&1 || true
            pip install -q -r requirements-ingest.txt >> "$OUT/setup.txt" 2>&1 || true
            if [[ "$TASK" == "crawl-log" ]]; then CMD=(run --limit 5 --hours 0.25); elif [[ "$TASK" == "archive-plan" ]]; then CMD=(archive-plan); else CMD=(ingest --limit 10 --hours 0.25); fi
            python -m ingest "${CMD[@]}" > "$OUT/log.txt" 2>&1 || echo "exit=$?" >> "$OUT/log.txt"
            tail -c 400000 "$OUT/log.txt" > "$OUT/log.tmp" && mv "$OUT/log.tmp" "$OUT/log.txt"
          fi
      - name: Save to the diagnostics branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [[ -d diag ]] || exit 0
          # Never commit a token or key: Mapillary client tokens and Google API keys are blanked in every text file.
          grep -rlIE 'MLY(\||%7C)|AIza[0-9A-Za-z_-]{30,}' diag | while read -r f; do sed -i -E 's/MLY(\||%7C)[^"&[:space:]<>]+/[token]/g; s/AIza[0-9A-Za-z_-]{30,}/[key]/g' "$f"; done || true
          mv diag "$RUNNER_TEMP/diag"
          if git fetch -q origin diagnostics; then git checkout -q -B diagnostics origin/diagnostics; else git checkout -q --orphan diagnostics && git rm -rq --cached . && git clean -fdq; fi
          mkdir -p diag && cp -r "$RUNNER_TEMP/diag/." diag/
          git add diag && git commit -qm "Diagnostics ${TASK} ${GITHUB_RUN_ID}"
          # Other workflows write to this branch too: on a race, take theirs and try again.
          for i in 1 2 3 4 5; do git push -q origin diagnostics && break; sleep $((i * 3)); git pull -q --rebase origin diagnostics; done
      # map-shots: the run fails when any two map controls overlap in any state (scripts/shots/layout.mjs).
      - name: Map layout check
        if: inputs.task == 'map-shots'
        run: |
          f="$RUNNER_TEMP/diag/${GITHUB_RUN_ID}/shots/overlaps.json"
          [[ -f "$f" ]] || { echo "The layout check did not run."; exit 1; }
          node -e 'const o = require(process.argv[1]); for (const f of o) console.log(f.file, f.error || "", (f.overlaps || []).map((x) => x.a + " x " + x.b).join("; ")); process.exit(o.length ? 1 : 0)' "$f"
